[project]
name = "document-to-markdown"
version = "1.0.0"
description = "Document to Markdown API service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "docling>=2.63.0",
    "fastapi>=0.115.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "pydantic-settings>=2.4.0",
    "pypdfium2>=4.30.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.9",
    "rapidocr>=3.8.1",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
ocr-cpu = [
    "onnxruntime>=1.18.0",
]
ocr-gpu = [
    "onnxruntime-gpu>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [".test"]
addopts = "-p no:cacheprovider"
norecursedirs = ["release", "data", "models", ".venv", ".tmp", "tmp"]
